<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="280" rx="16" fill="url(#bgGrad)" />
  <rect width="1000" height="280" rx="16" fill="none" stroke="#1F2937" stroke-width="2" />

  <!-- Subtle grid pattern overlay -->
  <g opacity="0.07" stroke="#93C5FD" stroke-width="1">
    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="160" x2="1000" y2="160" />
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="100" y1="0" x2="100" y2="280" />
    <line x1="200" y1="0" x2="200" y2="280" />
    <line x1="300" y1="0" x2="300" y2="280" />
    <line x1="400" y1="0" x2="400" y2="280" />
    <line x1="500" y1="0" x2="500" y2="280" />
    <line x1="600" y1="0" x2="600" y2="280" />
    <line x1="700" y1="0" x2="700" y2="280" />
    <line x1="800" y1="0" x2="800" y2="280" />
    <line x1="900" y1="0" x2="900" y2="280" />
  </g>

  <!-- Glowing Shield Icon -->
  <g transform="translate(65, 55)">
    <!-- Glow aura -->
    <circle cx="60" cy="80" r="75" fill="#3B82F6" opacity="0.2" filter="url(#glow)" />
    
    <!-- Shield shape -->
    <path d="M60 15 L115 35 C115 95, 60 145, 60 145 C60 145, 5 95, 5 35 Z" fill="url(#shieldGrad)" stroke="#60A5FA" stroke-width="3" />
    
    <!-- Lock symbol inside shield -->
    <rect x="42" y="70" width="36" height="30" rx="6" fill="#FFFFFF" />
    <path d="M48 70 V54 C48 46, 72 46, 72 54 V70" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="60" cy="83" r="3.5" fill="#1E3A8A" />
    <path d="M60 86.5 V93" stroke="#1E3A8A" stroke-width="3" stroke-linecap="round" />
    
    <!-- Sparkle accent -->
    <polygon points="110,25 113,33 121,36 113,39 110,47 107,39 99,36 107,33" fill="#FDE047" />
  </g>

  <!-- Header Title & Subtitle -->
  <g transform="translate(225, 80)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#brandGrad)" letter-spacing="-0.5">StudyLock AI</text>
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94A3B8">Cross-Platform Intelligent Focus Engine &amp; Study Productivity System</text>
  </g>

  <!-- Feature Pills / Badges -->
  <g transform="translate(225, 180)">
    <!-- Pill 1: FastAPI -->
    <g transform="translate(0, 0)">
      <rect width="105" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
      <text x="52.5" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="middle">⚡ FastAPI</text>
    </g>
    <!-- Pill 2: Next.js Web -->
    <g transform="translate(117, 0)">
      <rect width="120" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
      <text x="60" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC" text-anchor="middle">🖥️ Next.js Web</text>
    </g>
    <!-- Pill 3: MV3 Extension -->
    <g transform="translate(249, 0)">
      <rect width="138" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
      <text x="69" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34D399" text-anchor="middle">🌐 MV3 Extension</text>
    </g>
    <!-- Pill 4: Mobile & Desktop -->
    <g transform="translate(399, 0)">
      <rect width="158" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
      <text x="79" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#A78BFA" text-anchor="middle">📱 Android &amp; iOS</text>
    </g>
    <!-- Pill 5: XP Ledger -->
    <g transform="translate(569, 0)">
      <rect width="140" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
      <text x="70" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FBBF24" text-anchor="middle">🏆 XP Ledger</text>
    </g>
  </g>

  <!-- Status Light -->
  <g transform="translate(900, 32)">
    <circle cx="0" cy="0" r="5" fill="#10B981" />
    <circle cx="0" cy="0" r="10" fill="none" stroke="#10B981" opacity="0.4" />
    <text x="-12" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34D399" text-anchor="end">v1.0 Ready</text>
  </g>
</svg>

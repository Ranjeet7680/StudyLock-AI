<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="480">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60A5FA" />
    </marker>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FBBF24" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="14" fill="#0B1120" stroke="#1E293B" stroke-width="1.5" />

  <!-- Title -->
  <text x="480" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC" text-anchor="middle">Data Integrity: Offline-First Sync Engine &amp; Cryptographic XP Ledger</text>
  <text x="480" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94A3B8" text-anchor="middle">Dual Guarantees: Zero Data Loss on Network Failure + Zero Duplicate XP Minting (Sections 10 &amp; 14)</text>

  <!-- ==================== LEFT COLUMN: OFFLINE-FIRST SYNC ENGINE ==================== -->
  <g transform="translate(40, 80)">
    <rect width="420" height="370" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" filter="url(#boxShadow)" />
    <rect width="420" height="6" rx="3" fill="#38BDF8" />
    <text x="210" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#38BDF8" text-anchor="middle">🔄 OFFLINE-FIRST OUTBOX FLOW</text>
    
    <!-- Step 1 -->
    <g transform="translate(30, 52)">
      <rect width="360" height="46" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="23" r="12" fill="#1E293B" />
      <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle">1</text>
      <text x="50" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">User Mutation (Task / Schedule edit)</text>
      <text x="50" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">Immediate optimistic UI update (0ms latency)</text>
    </g>

    <path d="M 210 102 L 210 118" fill="none" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrowBlue)" />

    <!-- Step 2 -->
    <g transform="translate(30, 122)">
      <rect width="360" height="46" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="23" r="12" fill="#1E293B" />
      <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle">2</text>
      <text x="50" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Durable Local Commit &amp; Outbox Queue</text>
      <text x="50" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">Persisted to SQLite / Room with revision number</text>
    </g>

    <path d="M 210 172 L 210 188" fill="none" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrowBlue)" />

    <!-- Step 3 -->
    <g transform="translate(30, 192)">
      <rect width="360" height="46" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="23" r="12" fill="#1E293B" />
      <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle">3</text>
      <text x="50" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Idempotent Push to /api/v1/sync/push</text>
      <text x="50" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">Includes unique operation_id &amp; retry backoff</text>
    </g>

    <path d="M 210 242 L 210 258" fill="none" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrowBlue)" />

    <!-- Step 4 -->
    <g transform="translate(30, 262)">
      <rect width="360" height="46" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="23" r="12" fill="#1E293B" />
      <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle">4</text>
      <text x="50" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Monotonic Merge &amp; Tombstone Cleanup</text>
      <text x="50" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">Stale revisions rejected; tombstones broadcasted</text>
    </g>

    <text x="210" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#34D399" text-anchor="middle" font-weight="600">✓ Focus timers never block on network sync latency</text>
  </g>

  <!-- ==================== RIGHT COLUMN: REWARD LEDGER INTEGRITY ==================== -->
  <g transform="translate(500, 80)">
    <rect width="420" height="370" rx="12" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5" filter="url(#boxShadow)" />
    <rect width="420" height="6" rx="3" fill="#F59E0B" />
    <text x="210" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="middle">🏆 CRYPTOGRAPHIC REWARD LEDGER</text>
    
    <!-- Step 1 -->
    <g transform="translate(30, 52)">
      <rect width="360" height="46" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="23" r="12" fill="#1E293B" />
      <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">1</text>
      <text x="50" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Valid Session Completion Event</text>
      <text x="50" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">Focus ratio verified (&gt;= 80% planned time)</text>
    </g>

    <path d="M 210 102 L 210 118" fill="none" stroke="#FBBF24" stroke-width="2" marker-end="url(#arrowYellow)" />

    <!-- Step 2 -->
    <g transform="translate(30, 122)">
      <rect width="360" height="46" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="23" r="12" fill="#1E293B" />
      <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">2</text>
      <text x="50" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Deterministic Event Key Construction</text>
      <text x="50" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">e.g. EVT_SESSION_45M:session-uuid</text>
    </g>

    <path d="M 210 172 L 210 188" fill="none" stroke="#FBBF24" stroke-width="2" marker-end="url(#arrowYellow)" />

    <!-- Step 3 -->
    <g transform="translate(30, 192)">
      <rect width="360" height="46" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="23" r="12" fill="#1E293B" />
      <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">3</text>
      <text x="50" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">SQL UNIQUE Constraint Verification</text>
      <text x="50" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">Replayed requests cause rollback, not extra XP</text>
    </g>

    <path d="M 210 242 L 210 258" fill="none" stroke="#FBBF24" stroke-width="2" marker-end="url(#arrowYellow)" />

    <!-- Step 4 -->
    <g transform="translate(30, 262)">
      <rect width="360" height="46" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="23" r="12" fill="#1E293B" />
      <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">4</text>
      <text x="50" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Derived XP Sum &amp; Level Progression</text>
      <text x="50" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">XP is never a mutable field; calculated from ledger</text>
    </g>

    <text x="210" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#34D399" text-anchor="middle" font-weight="600">✓ Immutable ledger prevents gaming &amp; race conditions</text>
  </g>
</svg>

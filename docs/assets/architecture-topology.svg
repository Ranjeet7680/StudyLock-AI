      <text x="319" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">📅 Schedules (IANA)</text>

      <!-- Box 4 -->

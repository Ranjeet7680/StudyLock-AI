  <text x="480" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94A3B8" text-anchor="middle">Modular Monolith Core with Platform-Specific OS Restriction Adapters (Section 5)</text>

  <!-- ==================== 1. CLIENTS & ADAPTERS (BOTTOM TIER) ==================== -->
  <text x="480" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#60A5FA" text-anchor="middle" letter-spacing="1">CLIENT PLATFORMS &amp; OS RESTRICTION ADAPTERS</text>

  <!-- Web Dashboard -->
  <g transform="translate(30, 345)" filter="url(#shadow)">

      <text x="449" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">📱 Device Heartbeat</text>

      <!-- Box 10 -->
      <rect x="520" y="0" width="118" height="32" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="579" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">🔒 Privacy &amp; Purge</text>

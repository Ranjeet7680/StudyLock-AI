    <rect width="168" height="145" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
    <rect width="168" height="6" rx="3" fill="#34D399" />
    <text x="84" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="middle">🌐 WebExtension</text>
    <text x="84" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#34D399" text-anchor="middle">Chrome &amp; Edge (MV3)</text>

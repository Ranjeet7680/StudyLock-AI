      <text x="449" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">⏱️ Focus Sessions</text>

      <!-- Box 5 -->

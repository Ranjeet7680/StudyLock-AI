    <rect width="168" height="6" rx="3" fill="#38BDF8" />
    <text x="84" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="middle">💻 Web App</text>
    <text x="84" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#38BDF8" text-anchor="middle">Next.js 14 / React</text>
    <line x1="16" y1="56" x2="152" y2="56" stroke="#1E293B" stroke-width="1" />
    <text x="84" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#CBD5E1" text-anchor="middle">• 10 Screen Inventory</text>
    <text x="84" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#CBD5E1" text-anchor="middle">• AI Study Planner</text>
    <text x="84" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#CBD5E1" text-anchor="middle">• Real-Time Analytics</text>
    <text x="84" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Local-First UI State</text>
  </g>

  <!-- Browser Extension -->

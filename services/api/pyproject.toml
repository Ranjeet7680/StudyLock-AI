[project]
name = "studylock-ai-api"
version = "1.0.0"
description = "StudyLock AI — API Monolith"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.9.0",
    "requests>=2.31.0",
    "email-validator>=2.0.0",
    "slowapi>=0.1.9",
    "httpx>=0.27.0"
]

[tool.vercel]
entrypoint = "app.main:app"

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studylock-postgres
    environment:
      POSTGRES_USER: studylock_user
      POSTGRES_PASSWORD: studylock_secure_password_2026
      POSTGRES_DB: studylock_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studylock_user -d studylock_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: studylock-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    container_name: studylock-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://studylock_user:studylock_secure_password_2026@postgres:5432/studylock_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: production-secure-key-studylock-ai-2026
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
    container_name: studylock-web
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
